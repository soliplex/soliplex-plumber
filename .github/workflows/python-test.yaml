name: Python tests/coverage

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/soliplex_plumber/**'
      - 'tests/**'
      - '.github/workflows/python-test.yaml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/soliplex_plumber/**'
      - 'tests/**'
      - '.github/workflows/python-test.yaml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  test-soliplex-plumber:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]
        # Linux is the supported platform and carries the full version
        # matrix. Windows is checked for portability, on one version:
        # a break there is a break in the tests, not in the Python.
        exclude:
          - os: windows-latest
            python-version: "3.14"
    defaults:
      run:
        # The steps below are bash ('set -o pipefail', 'tee', the
        # summary heredoc); a Windows runner would otherwise use 'pwsh'.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          uv run pytest 2>&1 | tee unit-tests.log

      # Slack notification lives in 'ci-failure-notify.yaml', which only
      # links to this run (see #23), so record what failed here.
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "## ${{ matrix.os }}, Python ${{ matrix.python-version }} failed"
            echo
            for log in unit-tests.log; do
              [ -f "$log" ] || continue
              echo "<details><summary>$log (last 50 lines)</summary>"
              echo
              echo '```'
              tail -n 50 "$log"
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
